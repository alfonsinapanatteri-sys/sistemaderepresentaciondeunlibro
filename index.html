<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de representación de un libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
/* Plan: papel y tinta como las láminas del sistema; el libro dibujado es lo único grande de cada vista.
   Estructura: título + pestañas arriba, trabajo en dos columnas (datos | libro), estante como tablas de madera en línea. */
:root{
  --paper:#F6F4F0; --ink:#1C1C1C; --muted:#4A423B; --band:#A68B7B; --ok:#1F6B4F; --bad:#A33A2A;
  --display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#161412; --ink:#EDE8E1; --muted:#BDB3A8; --band:#A68B7B; --ok:#7CC4A0; --bad:#E58C7B; color-scheme: dark; }
  :root:not([data-theme="light"]) .icon{ filter: invert(1); }
}
:root[data-theme="dark"]{ --paper:#161412; --ink:#EDE8E1; --muted:#BDB3A8; --band:#A68B7B; --ok:#7CC4A0; --bad:#E58C7B; color-scheme: dark; }
:root[data-theme="dark"] .icon{ filter: invert(1); }

*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; }
body{ background:var(--paper); color:var(--ink); font:400 18px/1.5 var(--display); }
button,input,select{ font:inherit; color:inherit; }
.wrap{ max-width:1240px; margin:0 auto; padding:0 24px 64px; }

header{ padding:32px 0 0; }
.top{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 24px; }
h1{ margin:0; font-size:40px; line-height:1.1; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
.sub{ margin:6px 0 0; font-style:italic; color:var(--muted); max-width:62ch; }
#estado{ font-size:15px; font-style:italic; color:var(--muted); }
nav{ display:flex; gap:28px; margin-top:22px; border-bottom:2px solid var(--ink); }
.tab{ background:none; border:0; padding:8px 0 10px; font-size:22px; font-weight:600; cursor:pointer; color:var(--muted); border-bottom:6px solid transparent; margin-bottom:-2px; }
.tab[aria-current="page"]{ color:var(--ink); border-bottom-color:var(--band); }
.tab:hover{ color:var(--ink); }
:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }

section{ padding-top:32px; }
.cols{ display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:48px; align-items:start; }
@media (max-width:860px){ .cols{ grid-template-columns:1fr; gap:32px; } h1{ font-size:34px; } }

/* formulario */
form{ display:flex; flex-direction:column; gap:18px; }
fieldset{ border:0; border-top:2px solid var(--ink); margin:0; padding:10px 0 0; display:flex; flex-direction:column; gap:10px; }
legend{ padding:0 12px 0 0; font-weight:700; font-size:20px; }
legend small{ font-weight:400; font-style:italic; color:var(--muted); font-size:15px; margin-left:8px; }
label{ display:flex; flex-direction:column; gap:3px; font-size:15px; color:var(--muted); }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
input,select{ background:transparent; border:1.5px solid var(--ink); border-radius:0; padding:9px 11px; color:var(--ink); min-height:44px; width:100%; }
input::placeholder{ color:var(--muted); opacity:.7; }
select option{ background:var(--paper); color:var(--ink); }
.hint{ font-size:14px; font-style:italic; color:var(--muted); min-height:1.4em; margin:0; }
.hint.err{ color:var(--bad); font-style:normal; }
.btns{ display:flex; flex-wrap:wrap; gap:10px; }
.btn{ border:2px solid var(--ink); background:transparent; padding:10px 18px; cursor:pointer; font-weight:600; min-height:44px; }
.btn:hover{ background:var(--ink); color:var(--paper); }
.btn.main{ background:var(--ink); color:var(--paper); }
.btn.main:hover{ background:var(--band); border-color:var(--band); color:var(--ink); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

/* libro */
.book{ color:var(--ink); display:block; max-width:100%; height:auto; }
.band{ stroke:var(--paper); }
.stage{ display:grid; grid-template-columns:minmax(220px,420px) 1fr; gap:40px; align-items:start; }
@media (max-width:1100px){ .stage{ grid-template-columns:1fr; } }
.stage .book{ width:100%; }
.lectura{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; border-top:2px solid var(--ink); }
.lectura li{ display:grid; grid-template-columns:150px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
.lectura b{ font-weight:700; }
.lectura span{ color:var(--muted); font-style:italic; }
@media (max-width:520px){ .lectura li{ grid-template-columns:1fr; gap:0; } }
.ficha{ margin:18px 0 0; font-style:italic; color:var(--muted); font-size:16px; }

/* estante */
.tools{ display:flex; flex-wrap:wrap; align-items:end; gap:12px 24px; margin-bottom:28px; }
.tools label{ min-width:220px; }
.count{ font-style:italic; color:var(--muted); padding-bottom:10px; }
.shelf{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); row-gap:30px; }
.vol{ background:none; border:0; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:stretch; text-align:left; }
.stand{ display:flex; align-items:flex-end; justify-content:center; padding:10px 18px 0; border-bottom:9px solid var(--ink); min-height:250px; }
.stand .book{ height:236px; width:auto; max-width:100%; transition:transform .15s; }
.vol:hover .book{ transform:translateY(-6px); }
.vol[aria-pressed="true"] .stand{ border-bottom-color:var(--band); }
.vol[aria-pressed="true"] .cap{ font-weight:700; }
.cap{ padding:8px 18px 0; font-size:15px; font-style:italic; color:var(--muted); display:flex; gap:6px; align-items:baseline; min-width:0; }
.cap span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cap em{ font-style:normal; font-size:12px; border:1px solid currentColor; padding:0 5px; flex:none; }
.detalle{ margin-top:36px; border-top:2px solid var(--ink); padding-top:24px; }
.vacio{ font-style:italic; color:var(--muted); padding:40px 0; max-width:56ch; }

/* juego */
.seg{ display:inline-flex; border:2px solid var(--ink); margin-bottom:28px; }
.seg button{ background:none; border:0; padding:10px 20px; cursor:pointer; font-weight:600; min-height:44px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.gh{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 24px; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:28px; }
.gh b{ font-size:22px; }
.gh span{ font-style:italic; color:var(--muted); }
.res{ font-size:15px; font-style:italic; min-height:1.4em; }
.res.ok{ color:var(--ok); } .res.bad{ color:var(--bad); }
.fields{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
@media (max-width:520px){ .fields{ grid-template-columns:1fr; } }
.cands{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
@media (max-width:700px){ .cands{ grid-template-columns:1fr; } }
.cand{ background:none; border:2px solid var(--ink); padding:14px; cursor:pointer; display:flex; justify-content:center; align-items:flex-end; min-height:320px; }
.cand:hover{ background:color-mix(in srgb, var(--band) 22%, transparent); }
.cand .book{ height:290px; width:auto; }
.cand[data-state="right"]{ border-color:var(--ok); border-width:5px; }
.cand[data-state="wrong"]{ border-style:dashed; opacity:.75; }
.cand[disabled]{ cursor:default; }
dl.fd{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 18px; border-top:2px solid var(--ink); padding-top:12px; }
dl.fd dt{ font-weight:700; } dl.fd dd{ margin:0; color:var(--muted); font-style:italic; }
.final{ font-size:34px; font-weight:700; margin:0 0 8px; }

/* leyenda de signos */
.lg{ margin-bottom:44px; }
.lg h2{ margin:0; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; font-size:26px; border-bottom:2px solid var(--ink); padding-bottom:10px; }
.lg h2 small{ font-size:17px; font-weight:400; font-style:italic; color:var(--muted); }
.lg .nota{ margin:18px 0 0; font-style:italic; color:var(--muted); max-width:78ch; font-size:16px; }
.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:26px 20px; margin-top:24px; align-items:start; }
.items.t10{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:26px 10px; }
.items.t10 .fig, .items.t10 .fig img{ height:80px; }
.it{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; }
.it .fig{ height:96px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.it .fig svg{ height:100%; width:auto; max-width:100%; }
.it .fig img{ height:96px; width:auto; max-width:100%; object-fit:contain; }
.it b{ font-size:18px; display:block; }
.it span{ font-style:italic; color:var(--muted); font-size:15px; line-height:1.3; }
#aviso{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; font-size:16px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100% - 32px); }
#aviso.on{ opacity:1; }
@media (prefers-reduced-motion: reduce){ .stand .book, #aviso{ transition:none; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div>
      <h1>Sistema de representación de un libro</h1>
      <p class="sub">Cargá la ficha de un libro y se dibuja con el sistema: la tapa lleva autor, tema, lugar y año; el lomo, las páginas.</p>
    </div>
    <span id="estado" role="status" aria-live="polite">Cargando el estante…</span>
  </div>
  <nav aria-label="Secciones">
    <button class="tab" id="t-signos" data-tab="signos">Signos</button>
    <button class="tab" id="t-armar" data-tab="armar">Armar</button>
    <button class="tab" id="t-estante" data-tab="estante">Estante</button>
    <button class="tab" id="t-jugar" data-tab="jugar">Jugar</button>
  </nav>
</header>

<section id="v-signos">
  <div id="leyenda"></div>
</section>

<section id="v-armar" hidden>
  <div class="cols">
    <form id="form" autocomplete="off" novalidate>
      <fieldset>
        <legend>Título <small>marco de la tapa</small></legend>
        <label for="f-titulo">Título<input id="f-titulo" type="text" placeholder="Ficciones"></label>
        <label for="f-sub">Subtítulo (si hay, el marco es doble)<input id="f-sub" type="text" placeholder="fragmentos filosóficos"></label>
      </fieldset>
      <fieldset>
        <legend>Autor <small>responsabilidad</small></legend>
        <label for="f-autorTipo">Tipo de autor<select id="f-autorTipo"></select></label>
        <label for="f-autorNombre">Nombre<input id="f-autorNombre" type="text" placeholder="Borges, Jorge Luis"></label>
      </fieldset>
      <fieldset>
        <legend>Tema <small>clase CDD</small></legend>
        <label for="f-cdd">Clase CDD (general)<select id="f-cdd"></select></label>
        <p class="hint" id="h-cdd"></p>
      </fieldset>
      <fieldset>
        <legend>Lugar <small>y año de publicación</small></legend>
        <label for="f-lugarNombre">Ciudad<input id="f-lugarNombre" type="text" placeholder="Buenos Aires"></label>
        <label for="f-lugarNivel">Lugar de publicación<select id="f-lugarNivel"></select></label>
        <label for="f-anio" id="l-anio">Año<input id="f-anio" type="number" min="1" max="2100" placeholder="1944"></label>
      </fieldset>
      <fieldset>
        <legend>Páginas <small>lomo</small></legend>
        <div class="row">
          <label for="f-paginas">Páginas en total<input id="f-paginas" type="number" min="1" max="9999" placeholder="200"></label>
          <label for="f-vols">Volúmenes<input id="f-vols" type="number" min="1" max="4" placeholder="1"></label>
        </div>
      </fieldset>
      <div class="btns">
        <button type="button" class="btn main" id="b-guardar">Agregar al estante</button>
        <button type="button" class="btn" id="b-nuevo">Libro nuevo</button>
        <button type="button" class="btn" id="b-svg" hidden>Descargar SVG</button>
      </div>
      <p class="hint" id="h-form"></p>
    </form>

    <div>
      <div class="stage">
        <div id="p-book"></div>
        <div>
          <ol class="lectura" id="p-lectura"></ol>
          <p class="ficha" id="p-ficha"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="v-estante" hidden>
  <div class="tools">
    <label for="s-orden">Ordenar por
      <select id="s-orden">
        <option value="ingreso">Orden de ingreso</option>
        <option value="cdd">Tema (CDD)</option>
        <option value="anio">Año</option>
        <option value="paginas">Páginas</option>
        <option value="autor">Autor</option>
      </select>
    </label>
    <span class="count" id="s-count"></span>
  </div>
  <div class="shelf" id="s-shelf"></div>
  <div class="detalle" id="s-detalle" hidden></div>
</section>

<section id="v-jugar" hidden>
  <div class="seg" role="group" aria-label="Tipo de juego">
    <button id="g-leer" aria-pressed="true">Leer el libro</button>
    <button id="g-cual" aria-pressed="false">Elegir el libro</button>
  </div>
  <div id="game"></div>
</section>
</div>
<div id="aviso" role="status" aria-live="polite"></div>

  return [t, b.autorNombre, lugar, b.paginas ? b.paginas+' p.'+((+b.vols||1)>1?' · '+b.vols+' v.':'') : '', b.cdd ? 'CDD '+b.cdd : ''].filter(Boolean).join(' · ');
}

/* ---------- dibujo del libro ---------- */
function personG(cx, cy, n, ink, dashed){
  const vb = {1:[24,40],2:[54,40],3:[84,40]}[n], h = 70, s = h/vb[1], w = vb[0]*s;
  const one = '<circle cx="12" cy="9" r="6"/><path d="M2 38C2 25 6 18 12 18C18 18 22 25 22 38Z"/>';
  let body = one; for (let i=1;i<n;i++) body += `<g transform="translate(${30*i} 0)">${one}</g>`;
  const st = dashed ? `fill="none" stroke="${ink}" stroke-width="1.2" stroke-dasharray="1.8 1.5"` : `fill="${ink}"`;
  return `<g transform="translate(${(cx-w/2).toFixed(2)} ${(cy-h/2).toFixed(2)}) scale(${s.toFixed(4)})" ${st}>${body}</g>`;
}
function instG(cx, cy, ink){
  const w = 84, s = w/48, h = 44*s;
  return `<g transform="translate(${(cx-w/2).toFixed(2)} ${(cy-h/2).toFixed(2)}) scale(${s.toFixed(4)})"><polygon points="2,16 24,3 46,16" fill="${ink}"/><rect x="4" y="18" width="40" height="3" fill="${ink}"/><path d="M9 24V36M19 24V36M29 24V36M39 24V36" fill="none" stroke="${ink}" stroke-width="4"/><rect x="2" y="38" width="44" height="5" fill="${ink}"/></g>`;
}
function autorG(t, cx, cy, ink){
  if (t==='inst') return instG(cx, cy, ink);
  if (t==='anon') return personG(cx, cy, 1, ink, true);
  return personG(cx, cy, +t || 1, ink, false);
}
function pinG(cx, cy, rings, ink){
  const w = 92, s = w/80, h = 84*s;
  const e = [[14,5],[26,9],[38,13]].slice(0, rings).map(([rx,ry]) => `<ellipse cx="40" cy="64" rx="${rx}" ry="${ry}" fill="none" stroke="${ink}" stroke-width="3"/>`).join('');
  return `<g transform="translate(${(cx-w/2).toFixed(2)} ${(cy-h/2).toFixed(2)}) scale(${s.toFixed(4)})"><path d="M40 6C28 6 20 15 20 26C20 40 40 60 40 60C40 60 60 40 60 26C60 15 52 6 40 6Z" fill="none" stroke="${ink}" stroke-width="4"/><circle cx="40" cy="26" r="6" fill="${ink}"/><circle cx="40" cy="64" r="3.5" fill="${ink}"/>${e}</g>`;
}
function temaImg(cdd, cx, cy, exp, ink){
  const c = claseDe(cdd), S = 112;
  if (c===null) return `<rect x="${cx-40}" y="${cy-40}" width="80" height="80" fill="none" stroke="${ink}" stroke-width="2" stroke-dasharray="6 5"/>`;
  const ic = ICONS[c], k = Math.min(S/ic.w, S/ic.h), w = ic.w*k, h = ic.h*k;
  return `<image ${exp?'':'class="icon" '}href="${ic.u}" xlink:href="${ic.u}" x="${(cx-w/2).toFixed(1)}" y="${(cy-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
}
function bookSVG(b, o={}){
  const exp = !!o.exp, ink = exp ? '#1C1C1C' : 'currentColor';
  const n = Math.max(1, Math.min(4, +b.vols||1)), gap = 6;
  const sw = SW[bucketIdx(perVol(b))], sp = n*sw + (n-1)*gap, x0 = sp, cx = x0 + CW/2;
  let s = '';
  for (let i=0;i<n;i++){
    const sx = i*(sw+gap);
    s += `<rect x="${sx}" y="0" width="${sw}" height="${CH}" fill="${ink}"/>`;
    for (const y of [62,74,CH-74,CH-62]) s += `<line x1="${sx}" x2="${sx+sw}" y1="${y}" y2="${y}" ${exp?'stroke="#FFFFFF"':'class="band"'} stroke-width="3"/>`;
  }
  s += `<rect x="${x0+3}" y="3" width="${CW-6}" height="${CH-6}" fill="none" stroke="${ink}" stroke-width="6"/>`;
  if (b.sub) s += `<rect x="${x0+17}" y="17" width="${CW-34}" height="${CH-34}" fill="none" stroke="${ink}" stroke-width="3"/>`;
  for (const y of [178,352,468]) s += `<line x1="${cx-70}" x2="${cx+70}" y1="${y}" y2="${y}" stroke="${ink}" stroke-opacity=".28" stroke-width="1.5"/>`;
  s += autorG(b.autorTipo, cx, 100, ink) + temaImg(b.cdd, cx, 268, exp, ink) + pinG(cx, 412, +b.lugarNivel||0, ink);
  const yt = yearText(b), fs = yt.length<=5 ? 46 : yt.length<=7 ? 40 : 34;
  s += `<text x="${cx}" y="${CH-48}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${ink}" font-family="'Source Serif 4', Georgia, serif">${esc(yt)}</text>`;
  const W = sp+CW+8, H = CH+8;
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="book" viewBox="-4 -4 ${W} ${H}" ${exp?`width="${W}" height="${H}"`:''} role="img" aria-label="${esc(b.titulo||'Libro')}: ${esc(lectura(b).map(x=>x[1]).join('; '))}">${s}</svg>`;
}

/* ---------- estado ---------- */
let books = clone(EJEMPLOS), best = {leer:0, cual:0};
let draft = blank(), editing = null, tab = 'armar', sel = null;
let ref = null, downloads = null;
function blank(){ return {titulo:'', sub:'', autorTipo:'1', autorNombre:'', cdd:'', lugarNivel:0, lugarNombre:'', anio:'', paginas:'', vols:1}; }

/* ---------- guardado ---------- */
function setEstado(t){ $('#estado').textContent = t; }
let saving = false, again = false;
async function persist(){
  if (saving){ again = true; return; }
  saving = true;
  do {
    again = false;
    const data = {v:2, books: clone(books), best: clone(best)};
    try {
      if (ref){ await ref.set(data); setEstado('Estante guardado en tu cuenta'); }
      else { try { localStorage.setItem('biblioteca-de-signos', JSON.stringify(data)); setEstado('Estante guardado solo en este navegador'); } catch(e){ setEstado('Este estante no se guarda al cerrar'); } }
    } catch(e){ setEstado('No se pudo guardar el estante'); }
  } while (again);
  saving = false;
}
function aplicar(d){
  if (d && Array.isArray(d.books)){ books = d.books; if (!d.v || d.v<2) books.forEach(b => { b.lugarNivel = b.lugarNivel===0 ? 0 : Math.min(2, b.lugarNivel-1); }); }
  if (d && d.best) best = Object.assign({leer:0, cual:0}, d.best);
}
async function iniciarGuardado(){
  const cl = window.claude;
  if (cl && cl.use){
    try {
      const [db, user, dl] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads')]);
      downloads = dl; if (dl) $('#b-svg').hidden = false;
      const uid = user ? await user.id() : null;
      if (db && uid) ref = db.doc('data/users/'+uid+'/library');
    } catch(e){}
  }
  if (ref){
    try {
      const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('t')), 10000))]);
      if (snap.exists) aplicar(snap.data());
      setEstado('Estante guardado en tu cuenta');
    } catch(e){ setEstado('No se pudo leer tu estante: se muestran los ejemplos'); }
  } else {
    try { const raw = localStorage.getItem('biblioteca-de-signos'); if (raw){ aplicar(JSON.parse(raw)); setEstado('Estante guardado solo en este navegador'); } else setEstado('Los cambios se guardan solo en este navegador'); }
    catch(e){ setEstado('Este estante no se guarda al cerrar'); }
  }
  if (sel && !books.find(x=>x.id===sel)) sel = null;
  renderEstante(); if (tab==='jugar') renderGame();
}

/* ---------- Estante ---------- */
function ordenar(list){
  const k = $('#s-orden').value, c = list.slice();
  if (k==='cdd') c.sort((a,b)=> String(a.cdd).localeCompare(String(b.cdd)));
  else if (k==='anio') c.sort((a,b)=> (+a.anio||0)-(+b.anio||0));
  else if (k==='paginas') c.sort((a,b)=> (+a.paginas||0)-(+b.paginas||0));
  else if (k==='autor') c.sort((a,b)=> String(a.autorNombre||'').localeCompare(String(b.autorNombre||''), 'es'));
  return c;
}
function renderEstante(){
  const list = ordenar(books);
  $('#s-count').textContent = books.length===1 ? '1 libro' : books.length+' libros';
  const sh = $('#s-shelf');

  d.innerHTML = `<div class="stage"><div>${bookSVG(b)}</div><div><ol class="lectura">${lectura(b).map(([x,y])=>`<li><b>${esc(x)}</b><span>${esc(y)}</span></li>`).join('')}</ol><p class="ficha">${esc(fichaTexto(b))}${b.ejemplo?' · ejemplo ilustrativo, no es un registro verificado':''}</p><div class="btns" style="margin-top:20px"><button class="btn main" id="d-edit">Editar en Armar</button><button class="btn" id="d-del">Quitar del estante</button></div></div></div>`;
  $('#d-edit').addEventListener('click', () => { draft = clone(b); delete draft.id; delete draft.ejemplo; editing = b.id; aForm(); renderPreview(); location.hash = 'armar'; mostrar('armar'); });

}

const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = n => Math.floor(Math.random()*n);
function libroAzar(){
  return {id:'g'+Math.random().toString(36).slice(2,8), titulo:'', sub: Math.random()<0.3 ? 'x' : '', autorTipo: pick(['1','1','1','2','3','inst','anon']), autorNombre:'',
    cdd: String(rnd(10)*100).padStart(3,'0'), lugarNivel: rnd(3), lugarNombre:'', anio:1850 + rnd(170),

function nombreAutor(t){ return (AUTORES.find(a=>a[0]===t)||[])[1]; }

const PAGOPS = BUCKETS.map((l,i) => [String(i), l+' p.']).concat([['v','2 o más volúmenes: un lomo por volumen']]);
function opts(arr, sinElegir){ return (sinElegir?'<option value="">Elegí…</option>':'') + arr.map(([v,t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join(''); }
function renderLeer(g){

function comprobar(){
  if (G.hecho){ G.ronda++; if (G.ronda>G.total){ G.fin = true; if (G.puntos>best.leer){ best.leer = G.puntos; persist(); } } else { G.libro = libroAzar(); } G.hecho = false; renderGame(); return; }
  const b = G.libro, cor = {marco: b.sub?'si':'no', autor:b.autorTipo, tema:String(claseDe(b.cdd)), lugar:String(b.lugarNivel), pag:(+b.vols||1)>1 ? 'v' : String(bucketIdx(perVol(b))), anio:String(b.anio)};
  const txt = {marco: v=>v==='si'?'Doble: título y subtítulo':'Simple: título', autor: v=>nombreAutor(v), tema: v=>v+' · '+CLASES[+v], lugar: v=>LUGARES[+v], pag: v=>v==='v' ? '2 o más volúmenes' : BUCKETS[+v]+' p.', anio: v=>v};

function mutar(b, campo){
  const c = clone(b);
  if (campo==='marco') c.sub = c.sub ? '' : 'x';
  if (campo==='autor') c.autorTipo = pick(AUTORES.map(a=>a[0]).filter(x=>x!==b.autorTipo));
  if (campo==='tema'){ const k = pick([...Array(10).keys()].filter(x=>x!==claseDe(b.cdd))); c.cdd = String(k*100).padStart(3,'0'); }
  if (campo==='lugar') c.lugarNivel = pick([0,1,2].filter(x=>x!==b.lugarNivel));
  if (campo==='paginas'){
    const actual = (+b.vols||1)>1 ? 'v' : String(bucketIdx(perVol(b)));

  return c;
}
const ETQ = {marco:'marco', autor:'autor', tema:'tema', lugar:'lugar', paginas:'páginas', anio:'año'};

function fichaReal(b){
  const f = [['Título', b.titulo+(b.sub?': '+b.sub:'')], ['Autor', b.autorNombre], ['Publicación', b.lugarNombre+(b.ed&&b.ed!=='—'?': '+b.ed:'')]];
  const fe = String(b.anio);
  f.push(['Fecha', fe], ['Descripción', 'aprox. '+b.paginas+' p.'+((+b.vols||1)>1?' en '+b.vols+' vols.':'')], ['CDD', b.cdd]);
  return f;
}
function nuevaRondaCual(){
  G.usados = G.usados || [];
  let libres = CATALOGO.filter(x => !G.usados.includes(x.titulo));
  if (!libres.length){ G.usados = []; libres = CATALOGO; }
  const b = clone(pick(libres)); G.usados.push(b.titulo);
  const campos = ['marco','autor','tema','lugar','paginas','anio'].sort(()=>Math.random()-.5);
  const d1 = mutar(mutar(b, campos[0]), campos[1]), d2 = mutar(mutar(b, campos[2]), campos[3]);
  const lista = [{b, diff:[]}, {b:d1, diff:[campos[0],campos[1]]}, {b:d2, diff:[campos[2],campos[3]]}].sort(()=>Math.random()-.5);
  G.cands = lista; G.libro = b; G.ok = lista.findIndex(x=>x.b===b);
}
function renderCual(g){
  if (!G.cands) nuevaRondaCual();
  const r = fichaReal(G.libro);
  g.innerHTML = `<div class="gh"><b>Libro ${G.ronda} de ${G.total}</b><span>Puntaje: ${G.puntos}</span></div>
  <div class="cols" style="grid-template-columns:minmax(260px,360px) 1fr">
    <div><p class="sub" style="margin:0 0 14px">Buscá la tapa de este libro. El lugar se mide desde Argentina: nacional, regional (América) o internacional.</p><dl class="fd">${r.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div><div class="cands">${G.cands.map((c,i)=>`<button class="cand" data-i="${i}" aria-label="Libro ${i+1}">${bookSVG(c.b)}</button>`).join('')}</div>
    <p class="res" id="c-res" style="margin-top:14px"></p>
    <div class="btns" id="c-next" hidden style="margin-top:8px"><button class="btn main" id="c-sig">${G.ronda===G.total?'Ver resultado':'Siguiente libro'}</button></div></div></div>`;
  g.querySelectorAll('.cand').forEach(el => el.addEventListener('click', () => elegir(+el.dataset.i)));
}
function elegir(i){
  if (G.hecho) return;
  G.hecho = true;
  const bien = i===G.ok; if (bien) G.puntos++;
  document.querySelectorAll('.cand').forEach((el,j) => { el.disabled = true; el.dataset.state = j===G.ok ? 'right' : (j===i ? 'wrong' : ''); });
  const res = $('#c-res');
  res.className = 'res '+(bien?'ok':'bad');
  res.textContent = bien ? '✓ Correcto' : '✗ No. Ese libro difiere en: '+G.cands[i].diff.map(d=>ETQ[d]).join(' y ')+'. La tapa correcta está marcada con borde grueso.';
  $('#c-next').hidden = false;
  $('#c-sig').addEventListener('click', () => { G.ronda++; G.hecho = false; G.cands = null; if (G.ronda>G.total){ G.fin = true; if (G.puntos>best.cual){ best.cual = G.puntos; persist(); } } renderGame(); });
}

/* ---------- leyenda ---------- */
function renderLeyenda(){
  const sv = (vb, inner, h) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" ${h?`style="height:${h}px"`:''}>${inner}</svg>`;
  const it = (fig, cap, bold) => `<div class="it"><div class="fig">${fig}</div><div>${bold?`<b>${bold}</b>`:''}<span>${cap}</span></div></div>`;
  const ink = 'currentColor';
  const marco = d => sv('0 0 80 100', `<rect x="3" y="3" width="74" height="94" fill="none" stroke="${ink}" stroke-width="5"/>`+(d?`<rect x="13" y="13" width="54" height="74" fill="none" stroke="${ink}" stroke-width="2.5"/>`:''));
  const aut = (tipo) => sv('0 0 160 80', autorG(tipo, 80, 40, ink), 64);
  const pin = n => sv('0 0 100 100', pinG(50, 50, n, ink));
  const lomo = (w, n) => { let s = ''; for (let i=0;i<n;i++){ const x = 6 + i*(w+3); s += `<rect x="${x}" y="0" width="${w}" height="100" fill="${ink}"/>`; for (const y of [8,14,86,92]) s += `<line x1="${x}" x2="${x+w}" y1="${y}" y2="${y}" class="band" stroke-width="2"/>`; } return sv(`0 0 ${12+n*(w+3)} 100`, s); };
  const temas = CLASES.map((c,i) => it(`<img class="icon" src="${ICONS[i].u}" alt="">`, c, i+'00'));
  $('#leyenda').innerHTML = `
  <div class="lg"><h2>título <small>el marco es la tapa del libro · doble si tiene subtítulo</small></h2>
    <div class="items">${it(marco(false),'tapa simple')}${it(marco(true),'con subtítulo: marco doble')}</div>
    <p class="nota">Dentro de la tapa van el autor, el tema, el lugar y el año; el lomo lleva las páginas. Probalo en Armar.</p></div>
  <div class="lg"><h2>autor <small>mención de responsabilidad</small></h2>
    <div class="items">${it(aut('1'),'un autor personal')}${it(aut('2'),'dos autores')}${it(aut('3'),'tres o más autores: obra colectiva')}${it(aut('inst'),'autor institucional: entidad u organismo')}${it(aut('anon'),'anónimo: sin mención de responsabilidad')}</div></div>
  <div class="lg"><h2>temática <small>Clasificación Decimal Dewey</small></h2>
    <div class="items t10">${temas.join('')}</div>
    <p class="nota">Se usa el Sistema de Clasificación Decimal Dewey. Dewey dividió el conocimiento en diez grandes categorías: generalidades, filosofía, religión, ciencias sociales, filología, ciencias naturales, técnica y ciencias prácticas, arte y literatura e historia. Cada cifra puede subdividirse muchas veces para identificar claramente cada tema. Esto se hace para organizar los libros en la estantería, de forma que todos los libros que traten un tema específico queden ubicados en el mismo lugar.</p></div>
  <div class="lg"><h2>lugar <small>lugar de publicación · cada onda suma distancia respecto de donde está la biblioteca</small></h2>
    <div class="items">${it(pin(0),'nacional: Argentina')}${it(pin(1),'regional: América')}${it(pin(2),'internacional: resto del mundo')}</div></div>
  <div class="lg"><h2>páginas <small>el grosor del lomo crece con la cantidad de páginas</small></h2>
    <div class="items">${SW.map((w,i)=>it(lomo(w/2.2,1), BUCKETS[i]+' p.')).join('')}${it(lomo(SW[2]/2.2,2),'varios volúmenes: un lomo por volumen')}</div></div>
  <div class="lg"><h2>año <small>siempre en números</small></h2>
    <div class="items">${it('<span style="font:700 44px/1 var(--display);color:var(--ink);font-style:normal">1944</span>','el año de publicación, sin signos')}</div></div>`;
}
function start(d){
  llenarSelects(); renderLeyenda();
  if (d && d.draft) draft = d.draft;
  else { draft = clone(EJEMPLOS[0]); delete draft.id; delete draft.ejemplo; }
  aForm(); renderPreview();
  const t = location.hash.slice(1) || (d && d.tab) || 'signos';
  mostrar(t);
  setEstado('Cargando el estante…');
  iniciarGuardado();
  try { window.claude?.hot?.snapshot?.(() => ({draft, tab})); } catch(e){}
}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
